<!DOCTYPE html>
<html>

<body>

    <h2>What Can JavaScript Do?</h2>

    <p>JavaScript can change HTML attribute values.</p>

    <p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

    <button onclick="document.getElementById('myImage').src='https://media.tenor.com/gPsW1gUUu6YAAAAm/light-bulb-objects.webp'">Turn on the light</button>

    <img id="myImage" src=" style="width:100px">

    <button onclick="document.getElementById('myImage').src='https://media.tenor.com/Uv6XHpQIDxEAAAAm/light-bulb-light.webp'">Turn off the light</button>

</body>

</html>
