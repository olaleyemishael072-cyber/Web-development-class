<!DOCTYPE html>
<head>
<script>
    function myFunction() {
        document.getElementById("demo").innerHTML = "The paragraph has been changed.";
    }
</script>
</head>
<body>
<h2> Demo Javascript in head</h2>
<P id="demo">A Paragraph.</P>
<button type="button" onclick="myFunction()">Click me</button>

</body>
