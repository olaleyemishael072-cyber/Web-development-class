<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MoneyMate - Expense Tracker</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>💰 MoneyMate</h1>

        <p>Track your money. Reach your goals.</p>
    </header>

    <main>
        <!-- =========================
         SUMMARY SECTION
    ========================== -->

        <section class="summary">
            <div class="card">
                <h3>Total Income</h3>
                <p id="income">₦0</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenses">₦0</p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p id="balance">₦0</p>
            </div>
            <div class="card">
                <h3>Savings</h3>
                <p id="savings">₦0</p>
            </div>
        </section>

        <!-- =========================
         ADD TRANSACTION
    ========================== -->

        <section class="box">
            <h2>Add Transaction</h2>

        <label for="description ">Description:</label>
        <input type="text"id="description"
placeholder="e.g. school Books">

<label for ="amount">Amount:(₦)</label>
<input type="number" id="amount"
placeholder="Enter amount" min="1"

<label for="type">Transaction Type:</label>
<select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

            <label for="category">Category</label>
            <select id="category">
                <option value="food">Food</option>
                <option value="transport">Transport</option>
                <option value="school">School</option>
                <option value="entertainment">Entertainment</option>
                <option value="other">Other</option>
            </select>

            <button onclick="addTransaction()">         
add Transaction
</button>
</section>
        <!-- =========================
         TRANSACTION LIST
    ========================== -->

        <section class="box">
            <h2>Transaction History</h2>

            <input type="text" id="searchInput"
            placeholder="search transactions..."
            oninput="filterTractions()">

            <select id="categoryfilter"
            onchange="filterTransactions()">
                <option value="all">All Categories</option>
                <option value="food">Food</option>
                <option value="transport">Transport</option>
                <option value="school">School</option>
                <option value="entertainment">Entertainment</option>
                <option value="other">Other</option>
            </select>

            <ul id="transactionList"></ul>

            
        </section>

        <!-- =========================
         SAVINGS GOAL
    ========================== -->

        <section class="box savings">
            <h2>🎯 Savings Goal</h2>

        <label for="goal">Savings Target (₦)</label>
        <input type="number" id="goal" placeholder="Enter savings target">
        
        <label for="saved">Amount Already Saved (₦)</label>
        <input type="number" id="saved" placeholder="Enter amount saved">
        
        <button onclick="calculateSavings()">
            Calculate Savings
        </button>
        
        <div class="progress-container">
            <div id="progressBar"></div>

            <p id="savingResult">Set a goal to begin.</p>
        </section>
    </main>

    <footer>
        <p>MoneyMate © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
